name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Discord_Multi_Tool main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discord_Multi_Tool_Windows
          path: dist/Discord_Multi_Tool.exe
          if-no-files-found: error
